[project]
name = "deli-eplus-autosignup"
version = "1.4.0"
description = "得力E+ 自动签到工具（MuMu 模拟器 / uiautomator2）"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "xinbaji" }]
license = { text = "MIT" }
dependencies = [
    "uiautomator2>=3.7.0",
    "adbutils>=2.12.0",
    "pywebview>=6.0",
]

[project.urls]
Homepage = "https://github.com/xinbaji/Deli_EPlus_AutoSignUp"
Repository = "https://github.com/xinbaji/Deli_EPlus_AutoSignUp"
Issues = "https://github.com/xinbaji/Deli_EPlus_AutoSignUp/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pyinstaller>=6.21",
    "ruff>=0.6",
    "black>=24.0",
    "mypy>=1.11",
]

[project.scripts]
deli-eplus = "deli_eplus.cli:main"
deli-eplus-gui = "deli_eplus.gui:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "C4", "SIM"]
# 行长由 black 负责；BLE001（宽 except）在本项目是刻意的容错边界
ignore = ["E501"]

[tool.black]
line-length = 88
target-version = ["py310"]

[tool.mypy]
python_version = "3.10"
files = ["src"]
show_error_codes = true

# 第三方库无类型标注（uiautomator2 / adbutils 未提供 py.typed）
[[tool.mypy.overrides]]
module = ["adbutils.*", "uiautomator2.*"]
ignore_missing_imports = true
