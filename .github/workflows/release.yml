name: Build & Release

# 推送 v* 标签时自动：打包便携 zip → 创建 Release 并上传
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pyinstaller

      - name: Run tests
        shell: pwsh
        run: |
          python -m pytest -v --tb=long 2>&1 | Tee-Object -FilePath pytest-output.txt
          exit $LASTEXITCODE

      - name: Upload test log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-output
          path: pytest-output.txt

      - name: Build portable package
        run: python script/build.py

      - name: Upload Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Deli_EPlus_AutoSignUp_portable.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
