name: Build & Release

# 触发：推送到 beta 分支，且提交信息含版本号（"release: vX.X.X" / "发版 vX.X.X"）。
# 命中后自动打对应 v 标签并跑测试 + 打包 + 发 Release。
on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  auto-tag:
    # 本次 push 的提交里只要有一个带版本号就触发（不只看最新提交）
    if: |
      contains(join(github.event.commits.*.message, ' '), 'release: v') ||
      contains(join(github.event.commits.*.message, ' '), '发版 v')
    runs-on: ubuntu-latest
    outputs:
      ver: ${{ steps.ver.outputs.ver }}
    steps:
      - name: Checkout (needed for tag target)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Extract version from any commit in this push
        id: ver
        shell: bash
        run: |
          # 遍历本次 push 全部提交，取第一条含版本号的消息里的版本
          VER=""
          for c in $(git log --oneline origin/main -n 20 | awk '{print $1}'); do
            M=$(git log -1 --format=%s "$c")
            V=$(echo "$M" | grep -oE 'v[0-9]+\.[0-9]+\.[0-9]+' | head -1)
            if [ -n "$V" ]; then VER="$V"; break; fi
          done
          echo "ver=$VER"
          echo "ver=$VER" >> "$GITHUB_OUTPUT"
      - name: Create/Update version tag
        if: steps.ver.outputs.ver != ''
        shell: bash
        run: |
          VER="${{ steps.ver.outputs.ver }}"
          git tag -f "$VER" "${{ github.sha }}"
          git push origin "$VER" --force

  release:
    needs: auto-tag
    runs-on: windows-latest
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"   # 含 pytest + pyinstaller + ruff/black/mypy

      - name: Lint & type check
        shell: bash
        run: |
          set -e
          ruff check .
          black --check .
          mypy

      - name: Run tests
        shell: pwsh
        run: |
          python -m pytest -v --tb=short 2>&1 | Tee-Object -FilePath pytest-output.txt
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            Get-Content pytest-output.txt -Tail 40 | ForEach-Object {
              $line = $_ -replace '%', '%25'
              Write-Output "::error::$line"
            }
          }
          exit $code

      - name: Upload test log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-output
          path: pytest-output.txt

      - name: Disable Defender realtime (avoid PyInstaller exe quarantine flake)
        shell: pwsh
        run: Set-MpPreference -DisableRealtimeMonitoring $true

      - name: Build portable package
        shell: pwsh
        run: |
          python script/build.py 2>&1 | Tee-Object -FilePath build-output.txt
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            Get-Content build-output.txt | Select-String -Pattern "ERROR|Traceback|Exception|raise |FileNotFound|Permission" | Select-Object -Last 12 | ForEach-Object {
              $line = $_.Line
              Write-Output ("::error::" + $line.Substring(0, [Math]::Min(320, $line.Length)))
            }
            Get-Content build-output.txt -Tail 12 | ForEach-Object {
              if ($_) { Write-Output ("::error::TAIL " + $_.Substring(0, [Math]::Min(280, $_.Length))) }
            }
          }
          exit $code

      - name: Upload Release
        # 分支 push 触发时 github.ref 不是 tag，必须显式传 tag_name（auto-tag job 已打好 v 标签）
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.auto-tag.outputs.ver }}
          files: dist/Deli_EPlus_AutoSignUp_portable.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}