name: Build & Release

# 触发：推送到 beta 分支，且提交信息含版本号（"release: vX.X.X" / "发版 vX.X.X"）。
# 命中后自动打对应 v 标签并跑测试 + 打包 + 发 Release。
on:
  push:
    branches:
      - beta

permissions:
  contents: write

jobs:
  auto-tag:
    if: |
      contains(github.event.head_commit.message, 'release: v') ||
      contains(github.event.head_commit.message, '发版 v')
    runs-on: ubuntu-latest
    steps:
      - name: Extract version from commit message
        id: ver
        shell: bash
        run: |
          MSG="${{ github.event.head_commit.message }}"
          VER=$(echo "$MSG" | grep -oE 'v[0-9]+\.[0-9]+\.[0-9]+' | head -1)
          echo "ver=$VER"
          echo "ver=$VER" >> "$GITHUB_OUTPUT"
      - name: Create/Update version tag
        if: steps.ver.outputs.ver != ''
        shell: bash
        run: |
          VER="${{ steps.ver.outputs.ver }}"
          git tag -f "$VER" "${{ github.sha }}"
          git push origin "$VER" --force

  release:
    needs: auto-tag
    runs-on: windows-latest
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"   # 含 pytest + pyinstaller

      - name: Run tests
        shell: pwsh
        run: |
          python -m pytest -v --tb=short 2>&1 | Tee-Object -FilePath pytest-output.txt
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            Get-Content pytest-output.txt -Tail 40 | ForEach-Object {
              $line = $_ -replace '%', '%25'
              Write-Output "::error::$line"
            }
          }
          exit $code

      - name: Upload test log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-output
          path: pytest-output.txt

      - name: Disable Defender realtime (avoid PyInstaller exe quarantine flake)
        shell: pwsh
        run: Set-MpPreference -DisableRealtimeMonitoring $true

      - name: Build portable package
        shell: pwsh
        run: |
          python script/build.py 2>&1 | Tee-Object -FilePath build-output.txt
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            Get-Content build-output.txt | Select-String -Pattern "ERROR|Traceback|Exception|raise |FileNotFound|Permission" | Select-Object -Last 12 | ForEach-Object {
              $line = $_.Line
              Write-Output ("::error::" + $line.Substring(0, [Math]::Min(320, $line.Length)))
            }
            Get-Content build-output.txt -Tail 12 | ForEach-Object {
              if ($_) { Write-Output ("::error::TAIL " + $_.Substring(0, [Math]::Min(280, $_.Length))) }
            }
          }
          exit $code

      - name: Upload Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Deli_EPlus_AutoSignUp_portable.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}